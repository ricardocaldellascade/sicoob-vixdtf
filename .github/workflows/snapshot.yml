name: snapshot
on:
  push:
    branches: [snap-laser]
permissions:
  contents: write
jobs:
  grab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: snap-laser
      - name: baixar pedidos
        run: |
          B=https://pedidos-vixdtf.netlify.app
          mkdir -p pedidos && cd pedidos
          curl -sSL "$B/" -o index.html
          wc -c index.html
      - name: commitar
        run: |
          git config user.name snapshot
          git config user.email snapshot@users.noreply.github.com
          git add -A
          git commit -m "snapshot pedidos" || echo "sem mudanca"
          git push origin snap-laser
