name: snapshot
on:
  push:
    branches: [snap-laser]
permissions:
  contents: read
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - name: teste do checkout do chaveiro
        env:
          SUPA: https://pjyknhefixeeslqqlhfx.supabase.co
          KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBqeWtuaGVmaXhlZXNscXFsaGZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwNDk4MTUsImV4cCI6MjA5NjYyNTgxNX0.ICdlk2-0Z251h2ivFYktwqc5saH31eBupLiSZyDwuOQ
        run: |
          set -u
          P="chaveiro/teste/$(date +%s).png"
          printf 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==' | base64 -d > t.png
          echo "== upload =="
          curl -s -o /dev/null -w "storage: %{http_code}\n" -X POST "$SUPA/storage/v1/object/arquivos-pedidos/$P" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: image/png" --data-binary @t.png
          URL="$SUPA/storage/v1/object/public/arquivos-pedidos/$P"

          echo "== 0a) preflight do navegador (OPTIONS) =="
          curl -s -o /dev/null -w "options: %{http_code}\n" -X OPTIONS "$SUPA/functions/v1/pedido-chaveiro" \
            -H "Origin: https://chaveiro-vixdtf.netlify.app" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type,apikey,authorization"
          echo "-- cabecalhos do preflight --"
          curl -s -D - -o /dev/null -X OPTIONS "$SUPA/functions/v1/pedido-chaveiro" \
            -H "Origin: https://chaveiro-vixdtf.netlify.app" -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type,apikey,authorization" | grep -i "access-control\|^HTTP" || true

          echo "== 0b) POST sem chave (so pra saber se o verify_jwt barra) =="
          curl -s -o /dev/null -w "sem chave: %{http_code}\n" -X POST "$SUPA/functions/v1/pedido-chaveiro" \
            -H "content-type: application/json" -d '{"acao":"ping"}'

          echo "== 1) validacao: sem arquivo =="
          curl -s -X POST "$SUPA/functions/v1/pedido-chaveiro" -H "content-type: application/json" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -d '{"acao":"criar","produto":"fotogravacao","nome":"Teste","telefone":"27997357891","arquivos":[]}' ; echo

          echo "== 2) fotogravacao 2un foto+frase (deveria dar valor_cheio 139.80) =="
          R=$(curl -s -X POST "$SUPA/functions/v1/pedido-chaveiro" -H "content-type: application/json" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -d "{\"acao\":\"criar\",\"produto\":\"fotogravacao\",\"plano\":\"foto_frase\",\"quantidade\":2,\"frase\":\"Teste Vix\",\"nome\":\"Ricardo Teste\",\"telefone\":\"27997357891\",\"entrega\":\"retirada\",\"arquivos\":[{\"url\":\"$URL\",\"nome\":\"t.png\"}]}")
          echo "$R" | head -c 900; echo
          NSU=$(echo "$R" | sed -n 's/.*"order_nsu":"\([^"]*\)".*/\1/p')
          echo "order_nsu=$NSU"

          echo "== 3) confirmar (deveria vir pago:false) =="
          curl -s -X POST "$SUPA/functions/v1/pedido-chaveiro" -H "content-type: application/json" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -d "{\"acao\":\"confirmar\",\"order_nsu\":\"$NSU\"}" ; echo

          echo "== 4) varrer (rede de seguranca) =="
          curl -s "$SUPA/functions/v1/pedido-chaveiro?acao=varrer&token=vixchaveiro2026" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" | head -c 200; echo
          echo "== 4b) varrer com token errado (deve dar 403) =="
          curl -s -o /dev/null -w "token errado: %{http_code}\n" "$SUPA/functions/v1/pedido-chaveiro?acao=varrer&token=errado" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY"

          echo "== 5) cartao: validacao de CPF =="
          curl -s -X POST "$SUPA/functions/v1/pedido-chaveiro" -H "content-type: application/json" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -d "{\"acao\":\"criar\",\"produto\":\"fotogravacao\",\"plano\":\"foto\",\"quantidade\":1,\"nome\":\"Ricardo Teste\",\"telefone\":\"27997357891\",\"entrega\":\"retirada\",\"pagamento\":\"cartao_site\",\"cartao\":{\"numero\":\"5162306219378829\",\"nome\":\"RICARDO TESTE\",\"mes\":\"12\",\"ano\":\"28\",\"cvv\":\"318\"},\"titular\":{\"nome\":\"RICARDO TESTE\",\"email\":\"ricardo@vixdtf.com.br\",\"cpfCnpj\":\"123\",\"cep\":\"29062558\",\"numeroEndereco\":\"290\",\"telefone\":\"27997357891\"},\"arquivos\":[{\"url\":\"$URL\",\"nome\":\"t.png\"}]}" | head -c 300 ; echo

          echo "== 6) cartao: tentativa real com cartao de teste (deve recusar, nao cobrar) =="
          curl -s -X POST "$SUPA/functions/v1/pedido-chaveiro" -H "content-type: application/json" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -d "{\"acao\":\"criar\",\"produto\":\"fotogravacao\",\"plano\":\"foto_frase\",\"quantidade\":1,\"frase\":\"Teste\",\"orientacao\":\"pe\",\"fonte\":\"Saturday\",\"simbolo\":\"coracao\",\"nome\":\"Ricardo Teste\",\"telefone\":\"27997357891\",\"entrega\":\"retirada\",\"pagamento\":\"cartao_site\",\"cartao\":{\"numero\":\"4000000000000002\",\"nome\":\"RICARDO TESTE\",\"mes\":\"12\",\"ano\":\"28\",\"cvv\":\"318\"},\"titular\":{\"nome\":\"RICARDO TESTE\",\"email\":\"ricardo@vixdtf.com.br\",\"cpfCnpj\":\"32483699000184\",\"cep\":\"29062558\",\"numeroEndereco\":\"290\",\"telefone\":\"27997357891\"},\"arquivos\":[{\"url\":\"$URL\",\"nome\":\"t.png\"}]}" | head -c 400 ; echo

          echo "== 6b) desconto do Pix (1un so foto: itens 49,90 - 4,99 = 44,91) =="
          curl -s -X POST "$SUPA/functions/v1/pedido-chaveiro" -H "content-type: application/json" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -d "{\"acao\":\"criar\",\"produto\":\"fotogravacao\",\"plano\":\"foto\",\"quantidade\":1,\"nome\":\"Maria Conferencia\",\"telefone\":\"27988887777\",\"entrega\":\"retirada\",\"arquivos\":[{\"url\":\"$URL\",\"nome\":\"t.png\"}]}" | head -c 260 ; echo

          echo "== 6c) plano so frase, sem foto (esperado total 31,41) =="
          curl -s -X POST "$SUPA/functions/v1/pedido-chaveiro" -H "content-type: application/json" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -d '{"acao":"criar","produto":"fotogravacao","plano":"frase","quantidade":1,"frase":"Para sempre","orientacao":"deitado","fonte":"Saturday","simbolo":"coracao","nome":"Joana Conferencia","telefone":"27988886666","entrega":"retirada","arquivos":[]}' | head -c 260 ; echo

          echo "== 6d) plano com foto sem arquivo (tem que recusar) =="
          curl -s -X POST "$SUPA/functions/v1/pedido-chaveiro" -H "content-type: application/json" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -d '{"acao":"criar","produto":"fotogravacao","plano":"foto","quantidade":1,"nome":"Joana Conferencia","telefone":"27988886666","entrega":"retirada","arquivos":[]}' | head -c 200 ; echo

          echo "== 7) site no ar =="
          curl -s -o /dev/null -w "index: %{http_code}\n" https://chaveiro-vixdtf.netlify.app/
          curl -s -o /dev/null -w "atacado: %{http_code}\n" https://chaveiro-vixdtf.netlify.app/atacado
          curl -s -o /dev/null -w "fonte saturday: %{http_code}\n" https://chaveiro-vixdtf.netlify.app/fontes/saturday-regular.woff2
